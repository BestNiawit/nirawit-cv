<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Decorative dot pattern overlay -->
  <rect width="800" height="600" fill="url(#dots)"/>

  <!-- Decorative geometry: circles and abstract shapes -->
  <g opacity="0.12" fill="none" stroke="#ffffff" stroke-width="1.5">
    <circle cx="690" cy="100" r="120"/>
    <circle cx="690" cy="100" r="80"/>
    <circle cx="690" cy="100" r="40"/>
  </g>
  <g opacity="0.10" fill="#ffffff">
    <circle cx="90" cy="510" r="70"/>
    <circle cx="160" cy="560" r="30"/>
  </g>
  <g opacity="0.14" stroke="#ffffff" stroke-width="1" fill="none">
    <path d="M0 460 Q200 420 400 460 T800 460"/>
    <path d="M0 490 Q200 450 400 490 T800 490"/>
  </g>

  <!-- Floating chip elements (SaaS feel) -->
  <g opacity="0.18">
    <rect x="60" y="80" width="120" height="14" rx="7" fill="#ffffff"/>
    <rect x="60" y="104" width="80" height="10" rx="5" fill="#ffffff"/>
  </g>
  <g opacity="0.16">
    <rect x="620" y="500" width="140" height="12" rx="6" fill="#ffffff"/>
    <rect x="640" y="520" width="100" height="10" rx="5" fill="#ffffff"/>
  </g>

  <!-- Briefcase Icon (centered, ~120px tall) -->
  <g transform="translate(400 200)" filter="url(#ds)">
    <!-- Handle -->
    <path d="M -28 -50 Q -28 -68 -10 -68 L 10 -68 Q 28 -68 28 -50 L 28 -38"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- Case body -->
    <rect x="-70" y="-38" width="140" height="90" rx="10" fill="#ffffff" opacity="0.95"/>
    <!-- Case shadow strip -->
    <rect x="-70" y="-10" width="140" height="6" fill="#059669" opacity="0.35"/>
    <!-- Latch -->
    <rect x="-10" y="-14" width="20" height="10" rx="2" fill="#10b981"/>
    <!-- Inner detail lines -->
    <rect x="-60" y="-30" width="40" height="4" rx="2" fill="#10b981" opacity="0.55"/>
    <rect x="20" y="-30" width="40" height="4" rx="2" fill="#10b981" opacity="0.55"/>
    <!-- Small dot indicators (freelance/tasks) -->
    <circle cx="-50" cy="30" r="4" fill="#10b981"/>
    <circle cx="-30" cy="30" r="4" fill="#10b981" opacity="0.6"/>
    <circle cx="-10" cy="30" r="4" fill="#10b981" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="400" y="380" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="700"
        font-size="44" fill="#ffffff" filter="url(#ds)">
    Fastwork Platform
  </text>

  <!-- Subtitle -->
  <text x="400" y="418" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="500"
        font-size="22" fill="#ffffff" opacity="0.85">
    App  ·  Web  ·  CMS Admin
  </text>

  <!-- Accent line -->
  <line x1="350" y1="448" x2="450" y2="448" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>

  <!-- Badge -->
  <g transform="translate(400 488)">
    <rect x="-72" y="-16" width="144" height="32" rx="16" fill="#ffffff" opacity="0.18"/>
    <rect x="-72" y="-16" width="144" height="32" rx="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <circle cx="-48" cy="0" r="4" fill="#ffffff"/>
    <text x="8" y="5" text-anchor="middle"
          font-family="Inter, system-ui, sans-serif" font-weight="600"
          font-size="13" fill="#ffffff" letter-spacing="1.5">
      SAAS PRODUCT
    </text>
  </g>
</svg>