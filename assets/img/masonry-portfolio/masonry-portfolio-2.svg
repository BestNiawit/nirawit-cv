<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative geometry layer -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="80" cy="100" r="120"/>
    <circle cx="720" cy="520" r="140"/>
    <circle cx="650" cy="80" r="60"/>
  </g>
  <g opacity="0.12" stroke="#ffffff" stroke-width="1" fill="none">
    <path d="M0,450 Q200,380 400,450 T800,450"/>
    <path d="M0,500 Q200,430 400,500 T800,500"/>
    <path d="M0,550 Q200,480 400,550 T800,550"/>
  </g>
  <g opacity="0.15" fill="#ffffff">
    <circle cx="120" cy="380" r="2"/>
    <circle cx="160" cy="380" r="2"/>
    <circle cx="200" cy="380" r="2"/>
    <circle cx="120" cy="420" r="2"/>
    <circle cx="160" cy="420" r="2"/>
    <circle cx="200" cy="420" r="2"/>
    <circle cx="600" cy="180" r="2"/>
    <circle cx="640" cy="180" r="2"/>
    <circle cx="680" cy="180" r="2"/>
    <circle cx="600" cy="220" r="2"/>
    <circle cx="640" cy="220" r="2"/>
    <circle cx="680" cy="220" r="2"/>
  </g>

  <!-- Pipeline / Branching Diagram Icon ~120px tall, top-center -->
  <g transform="translate(400, 130)" filter="url(#dropShadow)">
    <!-- Connection lines (pipeline flow) -->
    <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
      <!-- Source to branch point -->
      <line x1="-130" y1="0" x2="-70" y2="0"/>
      <!-- Branch up -->
      <path d="M -70,0 Q -40,0 -40,-40 L 0,-40"/>
      <!-- Branch straight -->
      <line x1="-70" y1="0" x2="0" y2="0"/>
      <!-- Branch down -->
      <path d="M -70,0 Q -40,0 -40,40 L 0,40"/>
      <!-- Merge from up -->
      <path d="M 60,-40 L 100,-40 Q 130,-40 130,0"/>
      <!-- Merge straight -->
      <line x1="60" y1="0" x2="130" y2="0"/>
      <!-- Merge from down -->
      <path d="M 60,40 L 100,40 Q 130,40 130,0"/>
      <!-- to deploy -->
      <line x1="130" y1="0" x2="190" y2="0"/>
    </g>

    <!-- Source node (left) -->
    <circle cx="-130" cy="0" r="14" fill="url(#nodeGrad)"/>
    <circle cx="-130" cy="0" r="6" fill="#dc2626"/>

    <!-- Branch point -->
    <circle cx="-70" cy="0" r="10" fill="#ffffff"/>

    <!-- Build stages (3 parallel) -->
    <rect x="0" y="-52" width="60" height="24" rx="6" fill="#ffffff"/>
    <rect x="0" y="-12" width="60" height="24" rx="6" fill="#ffffff"/>
    <rect x="0" y="28" width="60" height="24" rx="6" fill="#ffffff"/>
    <!-- Stage indicators -->
    <circle cx="12" cy="-40" r="4" fill="#dc2626"/>
    <circle cx="12" cy="0" r="4" fill="#f59e0b"/>
    <circle cx="12" cy="40" r="4" fill="#dc2626"/>
    <!-- Stage bars -->
    <rect x="22" y="-44" width="32" height="3" rx="1.5" fill="#dc2626" opacity="0.5"/>
    <rect x="22" y="-38" width="22" height="3" rx="1.5" fill="#dc2626" opacity="0.3"/>
    <rect x="22" y="-4" width="32" height="3" rx="1.5" fill="#f59e0b" opacity="0.5"/>
    <rect x="22" y="2" width="22" height="3" rx="1.5" fill="#f59e0b" opacity="0.3"/>
    <rect x="22" y="36" width="32" height="3" rx="1.5" fill="#dc2626" opacity="0.5"/>
    <rect x="22" y="42" width="22" height="3" rx="1.5" fill="#dc2626" opacity="0.3"/>

    <!-- Merge node -->
    <circle cx="130" cy="0" r="10" fill="#ffffff"/>

    <!-- Deploy node (right) with checkmark -->
    <circle cx="190" cy="0" r="16" fill="url(#nodeGrad)"/>
    <path d="M 182,0 L 188,6 L 198,-4" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="400" y="345" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="44" text-anchor="middle" filter="url(#dropShadow)">QA Jenkins Pipeline</text>

  <!-- Subtitle -->
  <text x="400" y="385" fill="#ffffff" fill-opacity="0.85" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" text-anchor="middle">CI/CD · GitHub repo</text>

  <!-- Accent line -->
  <line x1="350" y1="410" x2="450" y2="410" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Small badge -->
  <g transform="translate(400, 450)">
    <rect x="-70" y="0" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="-48" cy="16" r="4" fill="#ffffff"/>
    <text x="8" y="22" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle" letter-spacing="1">AUTOMATION</text>
  </g>
</svg>