<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Dot grid overlay -->
  <rect width="800" height="600" fill="url(#dotGrid)"/>

  <!-- Decorative geometry: large soft circles -->
  <circle cx="100" cy="80" r="160" fill="#ffffff" opacity="0.06"/>
  <circle cx="720" cy="540" r="200" fill="#ffffff" opacity="0.07"/>
  <circle cx="680" cy="100" r="70" fill="#ffffff" opacity="0.08"/>

  <!-- Abstract diagonal lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.12" fill="none">
    <line x1="0" y1="500" x2="300" y2="200"/>
    <line x1="50" y1="550" x2="350" y2="250"/>
    <line x1="500" y1="600" x2="800" y2="300"/>
    <line x1="550" y1="600" x2="800" y2="350"/>
  </g>

  <!-- Small decorative dots -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="150" cy="450" r="3"/>
    <circle cx="180" cy="480" r="2"/>
    <circle cx="620" cy="160" r="3"/>
    <circle cx="650" cy="190" r="2"/>
    <circle cx="80" cy="300" r="2.5"/>
  </g>

  <!-- Graduation Cap Icon (centered, ~120px tall) -->
  <g transform="translate(400, 175)">
    <!-- Cap base / book pages -->
    <g opacity="0.95">
      <!-- Book under cap -->
      <rect x="-70" y="40" width="140" height="14" rx="2" fill="#ffffff" opacity="0.85"/>
      <rect x="-65" y="54" width="130" height="6" rx="1" fill="#ffffff" opacity="0.55"/>
      <line x1="0" y1="40" x2="0" y2="60" stroke="#dc2626" stroke-width="1.2" opacity="0.5"/>

      <!-- Mortarboard top (diamond) -->
      <path d="M 0,-50 L 95,-10 L 0,30 L -95,-10 Z" fill="#ffffff"/>
      <!-- Inner shadow line -->
      <path d="M 0,-42 L 80,-10 L 0,22 L -80,-10 Z" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.15"/>

      <!-- Cap band/head -->
      <path d="M -45,5 L -45,28 Q -45,38 0,38 Q 45,38 45,28 L 45,5 L 0,25 Z" fill="#ffffff" opacity="0.92"/>

      <!-- Tassel string -->
      <path d="M 0,-10 Q 60,-5 70,15 L 70,40" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Tassel button -->
      <circle cx="0" cy="-10" r="4" fill="#ffffff"/>
      <!-- Tassel -->
      <rect x="66" y="38" width="8" height="14" rx="1.5" fill="#ffffff"/>
      <line x1="68" y1="52" x2="68" y2="58" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="70" y1="52" x2="70" y2="58" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="72" y1="52" x2="72" y2="58" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="340" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="64" text-anchor="middle" filter="url(#textShadow)" letter-spacing="-1">SCG Digital</text>

  <!-- Subtitle -->
  <text x="400" y="385" fill="#ffffff" fill-opacity="0.88" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="26" text-anchor="middle">Automation Training</text>

  <!-- Accent line -->
  <line x1="350" y1="415" x2="450" y2="415" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Small badge under subtitle -->
  <g transform="translate(400, 450)">
    <rect x="-78" y="-16" width="156" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="-55" cy="0" r="3.5" fill="#ffffff"/>
    <text x="8" y="5" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle" letter-spacing="2">TRAINING PROGRAM</text>
  </g>
</svg>