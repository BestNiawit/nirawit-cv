<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glow10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg10)"/>
  <circle cx="150" cy="120" r="200" fill="url(#glow10)"/>
  <circle cx="680" cy="500" r="240" fill="url(#glow10)"/>

  <!-- subtle dot grid -->
  <g fill="#ffffff" fill-opacity="0.07">
    <circle cx="80"  cy="80"  r="2"/><circle cx="160" cy="80"  r="2"/><circle cx="240" cy="80"  r="2"/>
    <circle cx="640" cy="540" r="2"/><circle cx="720" cy="540" r="2"/><circle cx="560" cy="540" r="2"/>
    <circle cx="80"  cy="540" r="2"/><circle cx="720" cy="80"  r="2"/>
  </g>

  <!-- 4 stacked-kit icon: 2x2 grid of rounded squares -->
  <g transform="translate(330, 130)" filter="url(#shadow10)">
    <rect x="0"   y="0"   width="62" height="62" rx="10" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="74"  y="0"   width="62" height="62" rx="10" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="0"   y="74"  width="62" height="62" rx="10" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="74"  y="74"  width="62" height="62" rx="10" fill="#ffffff" fill-opacity="0.92"/>
    <!-- inner glyphs -->
    <g fill="#10b981" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
      <text x="31"  y="40">P</text>
      <text x="105" y="40">R</text>
      <text x="31"  y="114">J</text>
      <text x="105" y="114">k6</text>
    </g>
  </g>

  <!-- accent line -->
  <line x1="320" y1="300" x2="480" y2="300" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- title -->
  <text x="400" y="380" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="56" fill="#ffffff" text-anchor="middle" letter-spacing="-1" filter="url(#shadow10)">Starter Kits ×4</text>

  <!-- subtitle -->
  <text x="400" y="430" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">Reusable QA harnesses</text>

  <!-- bottom badge -->
  <g transform="translate(330, 470)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <text x="70" y="19" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">AUTHORED</text>
  </g>
</svg>
