<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative dot grid -->
  <rect width="800" height="600" fill="url(#dotGrid)"/>

  <!-- Decorative geometry layer -->
  <g opacity="0.08" fill="#ffffff">
    <circle cx="80" cy="100" r="120"/>
    <circle cx="720" cy="520" r="160"/>
  </g>
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.2" fill="none">
    <path d="M -20 480 Q 200 420 400 470 T 820 440"/>
    <path d="M -20 520 Q 200 460 400 510 T 820 480"/>
    <path d="M -20 560 Q 200 500 400 550 T 820 520"/>
  </g>
  <g opacity="0.12" fill="#ffffff">
    <circle cx="650" cy="120" r="3"/>
    <circle cx="690" cy="160" r="2"/>
    <circle cx="620" cy="180" r="2.5"/>
    <circle cx="140" cy="430" r="3"/>
    <circle cx="100" cy="470" r="2"/>
  </g>

  <!-- Bank building icon (centered top) -->
  <g transform="translate(400, 95)" filter="url(#dropShadow)">
    <!-- Pediment / roof triangle -->
    <path d="M -70 30 L 0 -5 L 70 30 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Architrave -->
    <rect x="-78" y="30" width="156" height="10" rx="2" fill="#ffffff" opacity="0.95"/>
    <!-- Columns -->
    <rect x="-60" y="44" width="14" height="60" fill="#ffffff" opacity="0.9"/>
    <rect x="-32" y="44" width="14" height="60" fill="#ffffff" opacity="0.9"/>
    <rect x="-4" y="44" width="14" height="60" fill="#ffffff" opacity="0.9"/>
    <rect x="24" y="44" width="14" height="60" fill="#ffffff" opacity="0.9"/>
    <rect x="52" y="44" width="8" height="60" fill="#ffffff" opacity="0.9"/>
    <!-- Base steps -->
    <rect x="-82" y="106" width="164" height="8" rx="2" fill="#ffffff" opacity="0.95"/>
    <rect x="-90" y="116" width="180" height="8" rx="2" fill="#ffffff" opacity="0.9"/>
    <!-- Dollar / currency mark on pediment -->
    <circle cx="0" cy="18" r="6" fill="#1e40af" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="400" y="335" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="56" text-anchor="middle" filter="url(#dropShadow)">ttb Bank</text>

  <!-- Subtitle -->
  <text x="400" y="380" fill="#ffffff" fill-opacity="0.85" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="24" text-anchor="middle">Core Banking</text>

  <!-- Accent line -->
  <line x1="350" y1="410" x2="450" y2="410" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- Badge -->
  <g transform="translate(400, 450)">
    <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="0" y="5" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle" letter-spacing="2">ENTERPRISE</text>
  </g>
</svg>