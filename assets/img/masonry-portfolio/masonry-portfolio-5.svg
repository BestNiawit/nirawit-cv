<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <rect width="800" height="600" fill="url(#dotGrid)"/>

  <!-- Decorative glow orbs -->
  <circle cx="120" cy="110" r="200" fill="url(#glow)"/>
  <circle cx="700" cy="510" r="220" fill="url(#glow)"/>

  <!-- Concentric signal/connectivity arcs (left) -->
  <g stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.13">
    <path d="M 60 300 A 60 60 0 0 1 60 180"/>
    <path d="M 60 320 A 100 100 0 0 1 60 140"/>
    <path d="M 60 340 A 140 140 0 0 1 60 100"/>
    <path d="M 60 360 A 180 180 0 0 1 60 60"/>
  </g>

  <!-- Concentric signal arcs (right) -->
  <g stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.13">
    <path d="M 740 320 A 60 60 0 0 0 740 440"/>
    <path d="M 740 300 A 100 100 0 0 0 740 460"/>
    <path d="M 740 280 A 140 140 0 0 0 740 480"/>
    <path d="M 740 260 A 180 180 0 0 0 740 500"/>
  </g>

  <!-- Sweeping network lines bottom -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.14">
    <path d="M -20 510 Q 200 460 400 500 T 820 480"/>
    <path d="M -20 540 Q 200 490 400 530 T 820 510"/>
  </g>

  <!-- Small dot clusters (data nodes) -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="130" cy="430" r="3"/>
    <circle cx="160" cy="450" r="2"/>
    <circle cx="100" cy="460" r="2.5"/>
    <circle cx="660" cy="130" r="3"/>
    <circle cx="690" cy="160" r="2"/>
    <circle cx="630" cy="170" r="2.5"/>
  </g>

  <!-- "AUTOMATION" small badge above the phone -->
  <g transform="translate(400, 78)">
    <rect x="-62" y="-13" width="124" height="26" rx="13" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="-44" cy="0" r="3" fill="#22d3ee"/>
    <text x="-30" y="4" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#ffffff" letter-spacing="2">QA AUTOMATION</text>
  </g>

  <!-- Smartphone with banking UI (centered, ~120px tall) -->
  <g transform="translate(400, 130)" filter="url(#phoneShadow)">
    <!-- Phone body -->
    <rect x="-40" y="0" width="80" height="140" rx="11" ry="11" fill="url(#phoneGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Notch -->
    <rect x="-9" y="4" width="18" height="3.5" rx="1.75" fill="#1e40af" opacity="0.5"/>
    <!-- Screen area -->
    <rect x="-34" y="12" width="68" height="118" rx="4" fill="url(#screenGrad)" opacity="0.96"/>

    <!-- Greeting line -->
    <rect x="-30" y="22" width="22" height="2" rx="1" fill="#ffffff" opacity="0.55"/>
    <rect x="-30" y="26" width="14" height="1.5" rx="0.75" fill="#ffffff" opacity="0.35"/>

    <!-- Balance card -->
    <rect x="-30" y="32" width="60" height="28" rx="4" fill="#ffffff" opacity="0.98"/>
    <text x="-26" y="40" font-family="Inter, system-ui, sans-serif" font-size="4" fill="#1e40af" opacity="0.7" font-weight="600">BALANCE</text>
    <text x="-26" y="50" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="700" fill="#1e40af">฿ 84,260</text>
    <!-- accent stripe on balance card -->
    <rect x="-30" y="56" width="60" height="2" rx="1" fill="#22d3ee"/>

    <!-- Quick action row (4 circular buttons) -->
    <circle cx="-22" cy="70" r="4.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="-7" cy="70" r="4.5" fill="#fbbf24"/>
    <circle cx="8" cy="70" r="4.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="23" cy="70" r="4.5" fill="#ffffff" opacity="0.9"/>
    <!-- icon glyphs inside buttons -->
    <path d="M -24 70 L -20 70 M -22 68 L -22 72" stroke="#1e40af" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M -9 70 L -5 70" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    <rect x="6.2" y="68.2" width="3.6" height="3.6" rx="0.5" fill="none" stroke="#1e40af" stroke-width="0.8"/>
    <circle cx="23" cy="70" r="1.6" fill="none" stroke="#1e40af" stroke-width="0.8"/>

    <!-- Transaction rows -->
    <rect x="-30" y="84" width="60" height="11" rx="2.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="-24" cy="89.5" r="2.5" fill="#22d3ee"/>
    <rect x="-19" y="87" width="22" height="1.4" rx="0.5" fill="#1e40af" opacity="0.75"/>
    <rect x="-19" y="90" width="14" height="1.1" rx="0.5" fill="#1e40af" opacity="0.4"/>
    <text x="26" y="91" font-family="Inter, system-ui, sans-serif" font-size="3.6" font-weight="700" fill="#16a34a" text-anchor="end">+1,200</text>

    <rect x="-30" y="97" width="60" height="11" rx="2.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="-24" cy="102.5" r="2.5" fill="#fbbf24"/>
    <rect x="-19" y="100" width="24" height="1.4" rx="0.5" fill="#1e40af" opacity="0.75"/>
    <rect x="-19" y="103" width="12" height="1.1" rx="0.5" fill="#1e40af" opacity="0.4"/>
    <text x="26" y="104" font-family="Inter, system-ui, sans-serif" font-size="3.6" font-weight="700" fill="#dc2626" text-anchor="end">-340</text>

    <rect x="-30" y="110" width="60" height="11" rx="2.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="-24" cy="115.5" r="2.5" fill="#22d3ee"/>
    <rect x="-19" y="113" width="20" height="1.4" rx="0.5" fill="#1e40af" opacity="0.75"/>
    <rect x="-19" y="116" width="15" height="1.1" rx="0.5" fill="#1e40af" opacity="0.4"/>
    <text x="26" y="117" font-family="Inter, system-ui, sans-serif" font-size="3.6" font-weight="700" fill="#16a34a" text-anchor="end">+780</text>

    <!-- Bottom home indicator -->
    <rect x="-11" y="125" width="22" height="2" rx="1" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Signal waves emanating from phone -->
  <g stroke="#22d3ee" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M 485 130 Q 525 165 500 220"/>
    <path d="M 315 130 Q 275 165 300 220"/>
  </g>

  <!-- Title -->
  <text x="400" y="375" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="56" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)" letter-spacing="-1">ttb Bank</text>

  <!-- Subtitle -->
  <text x="400" y="415" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">Digital Banking Automation</text>

  <!-- Accent line -->
  <line x1="350" y1="442" x2="450" y2="442" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Bottom badge: stack tags -->
  <g transform="translate(400, 478)">
    <rect x="-130" y="-16" width="260" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="-110" cy="0" r="3" fill="#22d3ee"/>
    <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">MOBILE &#183; WEB &#183; API</text>
  </g>
</svg>
