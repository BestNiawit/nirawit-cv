<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.88"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative geometry layer -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="80" cy="100" r="120"/>
    <circle cx="720" cy="520" r="160"/>
    <circle cx="680" cy="80" r="60"/>
  </g>
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.12">
    <path d="M 0 450 Q 200 400 400 450 T 800 450"/>
    <path d="M 0 480 Q 200 430 400 480 T 800 480"/>
    <path d="M 0 510 Q 200 460 400 510 T 800 510"/>
  </g>
  <g fill="#ffffff" opacity="0.18">
    <circle cx="120" cy="320" r="2.5"/>
    <circle cx="150" cy="320" r="2.5"/>
    <circle cx="180" cy="320" r="2.5"/>
    <circle cx="120" cy="350" r="2.5"/>
    <circle cx="150" cy="350" r="2.5"/>
    <circle cx="180" cy="350" r="2.5"/>
    <circle cx="120" cy="380" r="2.5"/>
    <circle cx="150" cy="380" r="2.5"/>
    <circle cx="180" cy="380" r="2.5"/>
    <circle cx="640" cy="220" r="2.5"/>
    <circle cx="670" cy="220" r="2.5"/>
    <circle cx="700" cy="220" r="2.5"/>
    <circle cx="640" cy="250" r="2.5"/>
    <circle cx="670" cy="250" r="2.5"/>
    <circle cx="700" cy="250" r="2.5"/>
  </g>

  <!-- Smartphone with banking UI icon -->
  <g transform="translate(400, 130)" filter="url(#phoneShadow)">
    <!-- Phone body -->
    <rect x="-35" y="-5" width="70" height="125" rx="10" ry="10" fill="url(#phoneGrad)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Notch -->
    <rect x="-8" y="-1" width="16" height="3" rx="1.5" fill="#d97706" opacity="0.4"/>
    <!-- Screen area -->
    <rect x="-30" y="6" width="60" height="105" rx="3" fill="#fef3c7" opacity="0.6"/>
    <!-- Balance card -->
    <rect x="-26" y="11" width="52" height="26" rx="3" fill="#d97706" opacity="0.85"/>
    <text x="-22" y="20" font-family="Inter, system-ui, sans-serif" font-size="4" fill="#ffffff" opacity="0.8">BALANCE</text>
    <text x="-22" y="30" font-family="Inter, system-ui, sans-serif" font-size="7" font-weight="700" fill="#ffffff">฿ 12,450</text>
    <!-- Action buttons row -->
    <circle cx="-18" cy="46" r="4" fill="#fbbf24"/>
    <circle cx="-6" cy="46" r="4" fill="#fbbf24"/>
    <circle cx="6" cy="46" r="4" fill="#fbbf24"/>
    <circle cx="18" cy="46" r="4" fill="#fbbf24"/>
    <!-- Tiny icons inside circles -->
    <path d="M -19 46 L -17 46 M -18 45 L -18 47" stroke="#ffffff" stroke-width="0.7"/>
    <path d="M -7 45 L -5 47 M -7 47 L -5 45" stroke="#ffffff" stroke-width="0.7"/>
    <rect x="4.5" y="44.5" width="3" height="3" fill="none" stroke="#ffffff" stroke-width="0.7"/>
    <circle cx="18" cy="46" r="1.5" fill="none" stroke="#ffffff" stroke-width="0.7"/>
    <!-- Transaction rows -->
    <rect x="-26" y="55" width="52" height="10" rx="2" fill="#ffffff"/>
    <circle cx="-21" cy="60" r="2.5" fill="#fbbf24"/>
    <rect x="-16" y="58" width="20" height="1.5" rx="0.5" fill="#92400e" opacity="0.7"/>
    <rect x="-16" y="61" width="14" height="1.2" rx="0.5" fill="#92400e" opacity="0.4"/>
    <text x="22" y="62" font-family="Inter, system-ui, sans-serif" font-size="3.5" font-weight="700" fill="#16a34a" text-anchor="end">+250</text>

    <rect x="-26" y="68" width="52" height="10" rx="2" fill="#ffffff"/>
    <circle cx="-21" cy="73" r="2.5" fill="#fbbf24"/>
    <rect x="-16" y="71" width="22" height="1.5" rx="0.5" fill="#92400e" opacity="0.7"/>
    <rect x="-16" y="74" width="12" height="1.2" rx="0.5" fill="#92400e" opacity="0.4"/>
    <text x="22" y="75" font-family="Inter, system-ui, sans-serif" font-size="3.5" font-weight="700" fill="#dc2626" text-anchor="end">-89</text>

    <rect x="-26" y="81" width="52" height="10" rx="2" fill="#ffffff"/>
    <circle cx="-21" cy="86" r="2.5" fill="#fbbf24"/>
    <rect x="-16" y="84" width="18" height="1.5" rx="0.5" fill="#92400e" opacity="0.7"/>
    <rect x="-16" y="87" width="15" height="1.2" rx="0.5" fill="#92400e" opacity="0.4"/>
    <text x="22" y="88" font-family="Inter, system-ui, sans-serif" font-size="3.5" font-weight="700" fill="#16a34a" text-anchor="end">+500</text>

    <!-- Bottom nav indicator -->
    <rect x="-10" y="105" width="20" height="2" rx="1" fill="#92400e" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="400" y="350" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="44" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)">Nimble KMA &#183; Krungsri</text>

  <!-- Subtitle -->
  <text x="400" y="395" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#ffffff" opacity="0.85" text-anchor="middle">Digital Banking</text>

  <!-- Accent line -->
  <line x1="360" y1="425" x2="440" y2="425" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Small badge -->
  <g transform="translate(400, 470)">
    <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#ffffff" opacity="0.18"/>
    <rect x="-70" y="-16" width="140" height="32" rx="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <circle cx="-50" cy="0" r="3" fill="#ffffff"/>
    <text x="-38" y="5" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#ffffff" opacity="0.95">Mobile Banking</text>
  </g>
</svg>