<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow11" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow11" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg11)"/>
  <circle cx="120" cy="500" r="220" fill="url(#glow11)"/>
  <circle cx="700" cy="120" r="200" fill="url(#glow11)"/>

  <!-- background waveform bars (decorative) -->
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="40"  y="270" width="6" height="60"  rx="3"/>
    <rect x="58"  y="240" width="6" height="120" rx="3"/>
    <rect x="76"  y="260" width="6" height="80"  rx="3"/>
    <rect x="94"  y="200" width="6" height="200" rx="3"/>
    <rect x="112" y="230" width="6" height="140" rx="3"/>
    <rect x="130" y="270" width="6" height="60"  rx="3"/>
    <rect x="650" y="260" width="6" height="80"  rx="3"/>
    <rect x="668" y="220" width="6" height="160" rx="3"/>
    <rect x="686" y="190" width="6" height="220" rx="3"/>
    <rect x="704" y="240" width="6" height="120" rx="3"/>
    <rect x="722" y="270" width="6" height="60"  rx="3"/>
    <rect x="740" y="260" width="6" height="80"  rx="3"/>
  </g>

  <!-- microphone icon -->
  <g transform="translate(360, 130)" filter="url(#shadow11)">
    <!-- mic body -->
    <rect x="14" y="0" width="52" height="80" rx="26" fill="#ffffff" fill-opacity="0.95"/>
    <!-- mic grill lines -->
    <g stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round">
      <line x1="22" y1="22" x2="58" y2="22"/>
      <line x1="22" y1="40" x2="58" y2="40"/>
      <line x1="22" y1="58" x2="58" y2="58"/>
    </g>
    <!-- mic stand arc -->
    <path d="M 0 80 Q 0 120 40 120 Q 80 120 80 80" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="120" x2="40" y2="140" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round"/>
    <line x1="22" y1="140" x2="58" y2="140" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round"/>
    <!-- small sparkle / accent -->
    <circle cx="78" cy="14" r="6" fill="#fbbf24"/>
    <circle cx="78" cy="14" r="2.4" fill="#ffffff"/>
  </g>

  <!-- accent line -->
  <line x1="320" y1="320" x2="480" y2="320" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- title -->
  <text x="400" y="400" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="50" fill="#ffffff" text-anchor="middle" letter-spacing="-1" filter="url(#shadow11)">AI Speech-to-Text</text>

  <!-- subtitle -->
  <text x="400" y="445" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">Independent Study · KMUTT</text>

  <!-- bottom badge -->
  <g transform="translate(310, 480)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <text x="90" y="19" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">M.SC. PROJECT</text>
  </g>
</svg>
