<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Decorative glow orbs -->
  <circle cx="120" cy="100" r="180" fill="url(#glow)"/>
  <circle cx="700" cy="520" r="220" fill="url(#glow)"/>

  <!-- Decorative neural network nodes/lines (low opacity) -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" fill="none">
    <line x1="60" y1="80" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="120" y2="280"/>
    <line x1="180" y1="160" x2="280" y2="240"/>
    <line x1="120" y1="280" x2="280" y2="240"/>
    <line x1="280" y1="240" x2="200" y2="400"/>
    <line x1="60" y1="80" x2="120" y2="280"/>
    <line x1="640" y1="120" x2="740" y2="220"/>
    <line x1="640" y1="120" x2="560" y2="240"/>
    <line x1="740" y1="220" x2="660" y2="360"/>
    <line x1="560" y1="240" x2="660" y2="360"/>
    <line x1="660" y1="360" x2="740" y2="500"/>
    <line x1="200" y1="400" x2="380" y2="500"/>
    <line x1="660" y1="360" x2="500" y2="500"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="60" cy="80" r="3"/>
    <circle cx="180" cy="160" r="3.5"/>
    <circle cx="120" cy="280" r="3"/>
    <circle cx="280" cy="240" r="4"/>
    <circle cx="200" cy="400" r="3"/>
    <circle cx="640" cy="120" r="3.5"/>
    <circle cx="740" cy="220" r="3"/>
    <circle cx="560" cy="240" r="3"/>
    <circle cx="660" cy="360" r="4"/>
    <circle cx="740" cy="500" r="3"/>
    <circle cx="380" cy="500" r="3"/>
    <circle cx="500" cy="500" r="3"/>
  </g>

  <!-- Subtle dot grid -->
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="40" cy="540" r="1.5"/>
    <circle cx="80" cy="540" r="1.5"/>
    <circle cx="120" cy="540" r="1.5"/>
    <circle cx="160" cy="540" r="1.5"/>
    <circle cx="40" cy="560" r="1.5"/>
    <circle cx="80" cy="560" r="1.5"/>
    <circle cx="120" cy="560" r="1.5"/>
    <circle cx="680" cy="60" r="1.5"/>
    <circle cx="720" cy="60" r="1.5"/>
    <circle cx="760" cy="60" r="1.5"/>
    <circle cx="720" cy="40" r="1.5"/>
    <circle cx="760" cy="40" r="1.5"/>
  </g>

  <!-- CPU chip icon with neural nodes (centered, ~120px tall) -->
  <g transform="translate(340, 130)" filter="url(#iconShadow)">
    <!-- chip pins -->
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="20" y="-8" width="6" height="14" rx="2"/>
      <rect x="40" y="-8" width="6" height="14" rx="2"/>
      <rect x="60" y="-8" width="6" height="14" rx="2"/>
      <rect x="80" y="-8" width="6" height="14" rx="2"/>
      <rect x="100" y="-8" width="6" height="14" rx="2"/>
      <rect x="20" y="114" width="6" height="14" rx="2"/>
      <rect x="40" y="114" width="6" height="14" rx="2"/>
      <rect x="60" y="114" width="6" height="14" rx="2"/>
      <rect x="80" y="114" width="6" height="14" rx="2"/>
      <rect x="100" y="114" width="6" height="14" rx="2"/>
      <rect x="-8" y="20" width="14" height="6" rx="2"/>
      <rect x="-8" y="40" width="14" height="6" rx="2"/>
      <rect x="-8" y="60" width="14" height="6" rx="2"/>
      <rect x="-8" y="80" width="14" height="6" rx="2"/>
      <rect x="-8" y="100" width="14" height="6" rx="2"/>
      <rect x="114" y="20" width="14" height="6" rx="2"/>
      <rect x="114" y="40" width="14" height="6" rx="2"/>
      <rect x="114" y="60" width="14" height="6" rx="2"/>
      <rect x="114" y="80" width="14" height="6" rx="2"/>
      <rect x="114" y="100" width="14" height="6" rx="2"/>
    </g>
    <!-- chip outer body -->
    <rect x="0" y="0" width="120" height="120" rx="16" fill="url(#chipGrad)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- inner panel -->
    <rect x="18" y="18" width="84" height="84" rx="10" fill="none" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- neural network inside chip -->
    <g stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.4" fill="none">
      <line x1="32" y1="38" x2="60" y2="60"/>
      <line x1="32" y1="60" x2="60" y2="60"/>
      <line x1="32" y1="82" x2="60" y2="60"/>
      <line x1="60" y1="60" x2="88" y2="38"/>
      <line x1="60" y1="60" x2="88" y2="60"/>
      <line x1="60" y1="60" x2="88" y2="82"/>
    </g>
    <g fill="#6366f1">
      <circle cx="32" cy="38" r="4"/>
      <circle cx="32" cy="60" r="4"/>
      <circle cx="32" cy="82" r="4"/>
      <circle cx="88" cy="38" r="4"/>
      <circle cx="88" cy="60" r="4"/>
      <circle cx="88" cy="82" r="4"/>
    </g>
    <circle cx="60" cy="60" r="6" fill="#a855f7"/>
    <circle cx="60" cy="60" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Title -->
  <text x="400" y="340" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="56" fill="#ffffff" text-anchor="middle" filter="url(#textShadow)" letter-spacing="-1">13 Custom AI Skills</text>

  <!-- Subtitle -->
  <text x="400" y="385" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.85" text-anchor="middle">Built on Claude Code</text>

  <!-- Accent line -->
  <line x1="350" y1="415" x2="450" y2="415" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge -->
  <g transform="translate(330, 445)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#ffffff"/>
    <circle cx="20" cy="17" r="7" fill="#ffffff" fill-opacity="0.3"/>
    <text x="80" y="22" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">AI POWERED</text>
  </g>
</svg>