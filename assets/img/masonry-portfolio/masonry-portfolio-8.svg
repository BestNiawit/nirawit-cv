<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="node" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <g fill="#ffffff" opacity="0.07">
    <circle cx="80" cy="90" r="120"/>
    <circle cx="720" cy="520" r="160"/>
    <circle cx="680" cy="80" r="50"/>
    <circle cx="120" cy="500" r="70"/>
  </g>

  <g stroke="#ffffff" stroke-width="1" opacity="0.12" fill="none">
    <path d="M0,420 Q200,360 400,420 T800,420"/>
    <path d="M0,460 Q200,400 400,460 T800,460"/>
    <path d="M0,500 Q200,440 400,500 T800,500"/>
  </g>

  <g fill="#ffffff" opacity="0.18">
    <circle cx="60" cy="220" r="2"/>
    <circle cx="110" cy="260" r="2"/>
    <circle cx="160" cy="180" r="2"/>
    <circle cx="700" cy="200" r="2"/>
    <circle cx="750" cy="260" r="2"/>
    <circle cx="640" cy="160" r="2"/>
    <circle cx="40" cy="380" r="2"/>
    <circle cx="760" cy="380" r="2"/>
  </g>

  <g transform="translate(400,170)">
    <g stroke="#ffffff" stroke-width="2" opacity="0.55" fill="none" stroke-linecap="round">
      <line x1="0" y1="-55" x2="-70" y2="-10"/>
      <line x1="0" y1="-55" x2="70" y2="-10"/>
      <line x1="0" y1="-55" x2="0" y2="20"/>
      <line x1="-70" y1="-10" x2="-50" y2="55"/>
      <line x1="70" y1="-10" x2="50" y2="55"/>
      <line x1="-70" y1="-10" x2="0" y2="20"/>
      <line x1="70" y1="-10" x2="0" y2="20"/>
      <line x1="0" y1="20" x2="-50" y2="55"/>
      <line x1="0" y1="20" x2="50" y2="55"/>
    </g>
    <g filter="url(#ds)">
      <circle cx="0" cy="-55" r="14" fill="url(#node)"/>
      <circle cx="-70" cy="-10" r="11" fill="url(#node)"/>
      <circle cx="70" cy="-10" r="11" fill="url(#node)"/>
      <circle cx="0" cy="20" r="16" fill="#ffffff"/>
      <circle cx="-50" cy="55" r="10" fill="url(#node)"/>
      <circle cx="50" cy="55" r="10" fill="url(#node)"/>
    </g>
    <circle cx="0" cy="20" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.45"/>
  </g>

  <text x="400" y="370" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="44" text-anchor="middle" filter="url(#ds)">How 13 AI Skills Connect</text>

  <text x="400" y="420" fill="#ffffff" fill-opacity="0.85" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" text-anchor="middle">EP02 · Workflow Design</text>

  <line x1="350" y1="450" x2="450" y2="450" stroke="#ffffff" stroke-width="2" opacity="0.7" stroke-linecap="round"/>

  <g transform="translate(400,490)">
    <rect x="-70" y="0" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="-48" cy="16" r="4" fill="#ffffff"/>
    <text x="6" y="21" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle" letter-spacing="1.5">AI WORKFLOW</text>
  </g>
</svg>